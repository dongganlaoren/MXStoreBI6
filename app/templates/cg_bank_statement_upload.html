{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <div class="card shadow-sm">
        <div class="card-header">
            <strong>成本治理｜银行流水导入</strong>
        </div>
        <div class="card-body">
            <form method="post" enctype="multipart/form-data" class="row g-3">
                {{ form.csrf_token }}

                <div class="col-12">
                    <label class="form-label">银行流水 PDF</label>
                    <input class="form-control" type="file" name="pdf_file" accept="application/pdf" required>
                </div>

                <div class="col-12">
                    <div class="form-text">系统会自动识别银行类型，无需手动选择。</div>
                </div>

                <div class="col-12">
                    <button type="submit" class="btn btn-primary">上传并解析</button>
                </div>
            </form>

            <div class="alert alert-secondary mt-3 mb-0">
                <div class="small">
                    提示：若 PDF 加密，系统会先自动尝试环境变量 <code>BANK_STATEMENT_PASSWORD</code> 中的默认密码；失败后再提示你输入。
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
