<script>
    // 防止浏览器扩展冲突
    (function() {
        'use strict';

        // 检查并初始化应用状态
        if (typeof window.AppUtils !== 'undefined') {
            console.log('应用工具库已加载');
        }

        // 自动隐藏提示信息
        document.addEventListener('DOMContentLoaded', function() {
            const alerts = document.querySelectorAll('.alert-dismissible');
            alerts.forEach(function(alert) {
                setTimeout(function() {
                    if (bootstrap && bootstrap.Alert) {
                        const bsAlert = new bootstrap.Alert(alert);
                        bsAlert.close();
                    }
                }, 5000);
            });
        });

        // 全局错误处理
        window.addEventListener('error', function(e) {
            // 忽略扩展相关错误
            if (e.message && (
                e.message.includes('extension') ||
                e.message.includes('chrome-extension') ||
                e.message.includes('runtime.lastError')
            )) {
                e.preventDefault();
                return false;
            }
        });

        // 处理扩展端口错误
        if (typeof chrome !== 'undefined' && chrome.runtime) {
            chrome.runtime.onMessage = chrome.runtime.onMessage || function() {};
        }
    })();
</script>

<script>
    // 转交审批人弹窗逻辑
    let transferRequestId = null;
    document.addEventListener('DOMContentLoaded', function() {
      const transferModal = document.getElementById('transferModal');
      const transferForm = document.getElementById('transferForm');
      const transferApproverInput = document.getElementById('transfer_approver_search');
      const transferApproverId = document.getElementById('transfer_approver_id');
      const transferSuggestBox = document.getElementById('transfer_approver_suggest');

      // 打开弹窗时，记录request_id
      transferModal.addEventListener('show.bs.modal', function(event) {
        const button = event.relatedTarget;
        transferRequestId = button.getAttribute('data-request-id');
        transferForm.action = `/reimbursement/${transferRequestId}/transfer`;
        transferApproverInput.value = '';
        transferApproverId.value = '';
        transferSuggestBox.innerHTML = '';
      });

      // 审批人自动补全
      let searchTimer = null;
      if (transferApproverInput && transferApproverId && transferSuggestBox) {
        transferApproverInput.addEventListener('input', function() {
          clearTimeout(searchTimer);
          const query = this.value.trim();
          if (!query) {
            transferSuggestBox.innerHTML = '';
            return;
          }
          searchTimer = setTimeout(function() {
            fetch('/reimbursement/approver_search?q=' + encodeURIComponent(query))
              .then(function(response) { return response.json(); })
              .then(function(data) {
                transferSuggestBox.innerHTML = '';
                data.forEach(function(user) {
                  const item = document.createElement('a');
                  item.className = 'list-group-item list-group-item-action';
                  item.textContent = user.label;
                  item.href = '#';
                  item.addEventListener('click', function(e) {
                    e.preventDefault();
                    transferApproverInput.value = user.label;
                    transferApproverId.value = user.user_id;
                    transferSuggestBox.innerHTML = '';
                  });
                  transferSuggestBox.appendChild(item);
                });
              })
              .catch(function(error) {
                console.error('搜索审批人失败:', error);
              });
          }, 300);
        });
        transferApproverInput.addEventListener('blur', function() {
          setTimeout(function() { transferSuggestBox.innerHTML = ''; }, 200);
        });
      }
    });
</script>


</body>
</html>
