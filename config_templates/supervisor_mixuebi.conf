# Supervisor配置文件 - Flask应用监控
# 文件位置: /etc/supervisor/conf.d/MXStoreBI6.conf

[program:MXStoreBI6]
command=/var/www/MXStoreBI6/venv/bin/gunicorn -w 4 -b 127.0.0.1:5000 run:app
directory=/var/www/MXStoreBI6
user=deployuser
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/var/www/MXStoreBI6/logs/supervisor.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=10
environment=FLASK_ENV=production,DATABASE_URL="mysql+pymysql://%(ENV_DB_USER)s:%(ENV_DB_PASSWORD)s@localhost/%(ENV_DB_NAME)s"

[program:MXStoreBI6_celery]
command=/var/www/MXStoreBI6/venv/bin/celery -A run.celery worker --loglevel=info
directory=/var/www/MXStoreBI6
user=deployuser
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/var/www/MXStoreBI6/logs/celery.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=10
environment=FLASK_ENV=production,DATABASE_URL="mysql+pymysql://%(ENV_DB_USER)s:%(ENV_DB_PASSWORD)s@localhost/%(ENV_DB_NAME)s"

[group:MXStoreBI6_group]
programs=MXStoreBI6,MXStoreBI6_celery
priority=999
