name: Debug Deployment SSH Connection

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Test SSH connectivity and directory
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: mxuser
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script: |
            DEPLOY_PATH="/var/www/MXStoreBI6"
            echo "[DEBUG] Connected to $(hostname)"
            echo "[DEBUG] Current user: $(whoami)"
            echo "[DEBUG] Check deploy path: $DEPLOY_PATH"
            if [ -d "$DEPLOY_PATH" ]; then
              echo "[DEBUG] Deploy path exists"
            else
              echo "[DEBUG] Deploy path missing, creating..."
              mkdir -p "$DEPLOY_PATH"
            fi
            echo "[DEBUG] Listing deploy path contents:"
            ls -la "$DEPLOY_PATH"
