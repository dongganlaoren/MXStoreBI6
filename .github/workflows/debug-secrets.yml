# .github/workflows/debug-secrets.yml
name: Debug SSH Secrets

# 这个工作流的触发方式是“手动触发”
# 你需要去 GitHub 仓库的 Actions 页面，找到 "Debug SSH Secrets"，然后点击 "Run workflow" 按钮来运行它
on:
  workflow_dispatch:

jobs:
  check-secrets:
    name: Check if SSH secrets are loaded
    runs-on: ubuntu-latest

    steps:
      - name: Verify Secrets Content
        run: |
          echo "正在开始检查..."
          echo "-------------------------------------"
          
          # 检查 SSH_HOST
          if [ -z "${{ secrets.SSH_HOST }}" ]; then
            echo "❌ 错误: SSH_HOST 未设置或为空。"
          else
            echo "✅ 成功: SSH_HOST 已加载。"
          fi

          # 检查 SSH_USER
          if [ -z "${{ secrets.SSH_USER }}" ]; then
            echo "❌ 错误: SSH_USER 未设置或为空。"
          else
            echo "✅ 成功: SSH_USER 已加载。"
          fi

          # 检查 SSH_PRIVATE_KEY
          if [ -z "${{ secrets.SSH_PRIVATE_KEY }}" ]; then
            echo "❌ 错误: SSH_PRIVATE_KEY 未设置或为空。"
          else
            echo "✅ 成功: SSH_PRIVATE_KEY 已加载。"
            # 额外检查一下私钥的格式是否正确，这是一个常见错误点
            if [[ "${{ secrets.SSH_PRIVATE_KEY }}" == *"-----BEGIN"* ]]; then
              echo "    └── 格式检查通过 (包含 '-----BEGIN' 标志)。"
            else
              echo "    └── ⚠️ 警告: 私钥格式可能不正确，请确认是否完整复制了以 '-----BEGIN...' 开头并以 '-----END...' 结尾的全部内容。"
            fi
          fi
          
          echo "-------------------------------------"
          echo "检查完毕。"
