name: CI/CD 自动部署 MXStoreBI6

on:
  push:
    branches:
      - main  # 主分支更新时触发

env:
  PROJECT_NAME: MXStoreBI6
  DEPLOY_PATH: /var/www/MXStoreBI6
  VENV_PATH: /var/www/MXStoreBI6/venv

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 展示部署环境变量
        run: |
          echo "部署路径: $DEPLOY_PATH"
          echo "项目名称: $PROJECT_NAME"

      - name: 部署到远程服务器并进行健康探测
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: mxuser
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script: |
            set -euo pipefail

            # 远程环境变量
            PROJECT_NAME="${PROJECT_NAME:-MXStoreBI6}"
            DEPLOY_PATH="${DEPLOY_PATH:-/var/www/MXStoreBI6}"
            VENV_PATH="${VENV_PATH:-/var/www/MXStoreBI6/venv}"

            echo "✅ [连接成功] 主机: $(hostname) | 用户: $(whoami)"
            echo "📂 [步骤] 切换到部署目录: $DEPLOY_PATH"
            cd "$DEPLOY_PATH"

            echo "🔄 [步骤] 拉取远程最新代码"
            git fetch origin main
            git reset --hard origin/main

            echo "🐍 [步骤] 激活虚拟环境并安装依赖"
            source "$VENV_PATH/bin/activate"
            pip install --upgrade pip
            pip install -r requirements.txt

            echo "🛡️ [检测] 检查 sudo 免密权限 supervisorctl"
            if sudo -n /usr/bin/supervisorctl status >/dev/null 2>&1; then
              echo "✅ [权限验证] sudo 权限正常，继续部署"
            else
              echo "❌ [权限异常] sudo 权限不足，请检查 /etc/sudoers 配置"
              exit 1
            fi

            echo "🌀 [步骤] 重启 Supervisor 项目: $PROJECT_NAME"
            sudo -n /usr/bin/supervisorctl restart "$PROJECT_NAME"

            echo "🔍 [步骤] 执行部署后探测脚本"
            CHECK_SCRIPT="$DEPLOY_PATH/tools/post_deploy_check.sh"
            if [ -f "$CHECK_SCRIPT" ]; then
              echo "🔧 [探测脚本] 检测到 $CHECK_SCRIPT"
              chmod +x "$CHECK_SCRIPT"
              if bash "$CHECK_SCRIPT"; then
                echo "✅ [探测结果] 服务运行状态良好"
              else
                echo "❌ [探测失败] 服务状态异常，请检查日志"
                exit 1
              fi
            else
              echo "⚠️ [跳过探测] 未找到 $CHECK_SCRIPT，请确认是否遗漏"
              # exit 1  # 需强制失败时取消注释
            fi

            echo "🎉 [完成] 自动部署流程执行完毕"
