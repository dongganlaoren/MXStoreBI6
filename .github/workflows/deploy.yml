name: CI and Deploy

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        run: pytest -q

  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: ${{ github.ref == 'refs/heads/main' && secrets.SSH_HOST != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare SSH key
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: 备份代码（远程）
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT || 22 }}
          REMOTE_APP_DIR: ${{ secrets.REMOTE_APP_DIR }}
        run: |
          REMOTE_DIR=${REMOTE_APP_DIR:-"mixuebi"}
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -p ${SSH_PORT:-22} "$SSH_USER@$SSH_HOST" bash -lc '
            set -e
            APP_DIR="$HOME/'"$REMOTE_DIR"'"
            BACKUP_DIR="$HOME/backups/code"
            mkdir -p "$BACKUP_DIR"
            TS=$(date +%Y%m%d_%H%M%S)
            if [ -d "$APP_DIR" ]; then
              tar -czf "$BACKUP_DIR/'"$REMOTE_DIR"'_$TS.tgz" -C "$APP_DIR" .
              echo "Code backup saved: $BACKUP_DIR/'"$REMOTE_DIR"'_$TS.tgz"
            else
              echo "App dir not found, skip code backup: $APP_DIR"
            fi
          '

      - name: 备份数据库（远程）
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT || 22 }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -p ${SSH_PORT:-22} "$SSH_USER@$SSH_HOST" bash -lc '
            set -e
            BACKUP_DIR="$HOME/backups/db"
            mkdir -p "$BACKUP_DIR"
            TS=$(date +%Y%m%d_%H%M%S)
            if command -v mysqldump >/dev/null 2>&1; then
              mysqldump -u '"$DB_USER"' -p'"$DB_PASSWORD"' '"$DB_NAME"' | gzip > "$BACKUP_DIR/'"$DB_NAME"'_$TS.sql.gz"
              echo "DB backup saved: $BACKUP_DIR/'"$DB_NAME"'_$TS.sql.gz"
            else
              echo "mysqldump not found, skip DB backup" && exit 0
            fi
          '

      - name: 部署程序（同步代码 + 依赖安装 + 迁移 + 重启）
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT || 22 }}
          REMOTE_APP_DIR: ${{ secrets.REMOTE_APP_DIR }}
        run: |
          REMOTE_DIR=${REMOTE_APP_DIR:-"mixuebi"}
          # 同步代码到远端目录
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -p ${SSH_PORT:-22} "$SSH_USER@$SSH_HOST" "mkdir -p ~/$REMOTE_DIR"
          rsync -az --delete -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -p ${SSH_PORT:-22}" ./ "$SSH_USER@$SSH_HOST:~/$REMOTE_DIR/"
          # 远端安装依赖、迁移并重启服务
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -p ${SSH_PORT:-22} "$SSH_USER@$SSH_HOST" bash -lc '
            set -e
            APP_DIR="$HOME/'"$REMOTE_DIR"'"
            cd "$APP_DIR"
            # Python 虚拟环境
            if [ ! -d "venv" ]; then
              python3 -m venv venv
            fi
            source venv/bin/activate
            python -m pip install --upgrade pip
            REQ_FILE="requirements.production.txt"
            [ -f "$REQ_FILE" ] || REQ_FILE="requirements.txt"
            pip install -r "$REQ_FILE"
            # 迁移
            export FLASK_APP=run.py
            if command -v flask >/dev/null 2>&1; then
              flask db upgrade || true
            fi
            # 重启服务（可选）
            (sudo supervisorctl reread && sudo supervisorctl update && sudo supervisorctl restart all) || true
            (sudo systemctl reload nginx) || true
          '
