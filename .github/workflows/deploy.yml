name: CI/CD 自动部署 MXStoreBI6

on:
  push:
    branches:
      - main  # 主分支更新时触发

env:
  PROJECT_NAME: MXStoreBI6
  DEPLOY_PATH: /var/www/MXStoreBI6
  VENV_PATH: /var/www/MXStoreBI6/venv

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 展示部署环境变量
        run: |
          echo "部署路径: $DEPLOY_PATH"
          echo "项目名称: $PROJECT_NAME"

      - name: 部署到远程服务器
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: mxuser
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script: |
            echo "[INFO] 登录成功，当前主机: $(hostname)"
            echo "[INFO] 当前用户: $(whoami)"

            echo "[STEP] 进入部署目录: $DEPLOY_PATH"
            cd $DEPLOY_PATH

            echo "[STEP] 拉取最新代码"
            git pull origin main

            echo "[STEP] 激活虚拟环境并安装依赖"
            source $VENV_PATH/bin/activate
            pip install --upgrade pip
            pip install -r requirements.txt

            echo "[STEP] 重启 Supervisor 服务: $PROJECT_NAME"
            supervisorctl restart $PROJECT_NAME

            echo "[SUCCESS] 部署完成"
