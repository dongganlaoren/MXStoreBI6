name: deploy

on:
  push:
    branches:
      - main

env:
  PROJECT_NAME: MXStoreBI6
  DEPLOY_PATH: /var/www/MXStoreBI6
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest

    steps:
      - name: Set up job
        run: echo "🚀 开始部署流程..."

      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11

      - name: Generate version tag
        id: version
        run: |
          VERSION="v$(date +'%Y.%m.%d')-build.$(echo $GITHUB_RUN_NUMBER)"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create and push Git tag
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag ${{ steps.version.outputs.version }}
          git push origin ${{ steps.version.outputs.version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "✅ 登录成功，开始部署..."
            cd $DEPLOY_PATH
            git pull origin main
            source venv/bin/activate
            pip install -r requirements.txt
            supervisorctl restart ${PROJECT_NAME}

      - name: Backup database and static files on server
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "📦 备份数据库与静态资源..."
            mkdir -p ~/backup/${PROJECT_NAME}
            cp $DEPLOY_PATH/app/static/* ~/backup/${PROJECT_NAME}/
            pg_dump -U dbuser dbname > ~/backup/${PROJECT_NAME}/db_$(date +%F).sql || echo "跳过数据库备份"
