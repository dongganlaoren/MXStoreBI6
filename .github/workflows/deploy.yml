name: Deploy MXStoreBI6 to Ubuntu Server

on:
  push:
    branches:
      - main  # 仅主分支触发部署
  workflow_dispatch:  # 手动触发

env:
  PROJECT_NAME: MXStoreBI6
  DEPLOY_PATH: /var/www/MXStoreBI6

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Display environment variables
        run: |
          echo "Project: $PROJECT_NAME"
          echo "Deploy path: $DEPLOY_PATH"

      - name: Deploy to remote server via SSH
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: mxuser
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script: |
            echo "Start deployment on $(hostname)"

            # 确保部署目录存在
            if [ ! -d "$DEPLOY_PATH" ]; then
              echo "Deploy path does not exist, creating..."
              mkdir -p "$DEPLOY_PATH"
            fi

            # 拉取最新代码示例（假设已配置Git远程）
            cd "$DEPLOY_PATH"
            if [ -d ".git" ]; then
              git reset --hard
              git pull origin main
            else
              git clone https://github.com/<your-org-or-user>/${PROJECT_NAME}.git "$DEPLOY_PATH"
            fi

            # 示例：重启服务（请根据实际情况替换）
            # sudo systemctl restart mxstorebi6.service

            echo "Deployment finished successfully."
