name: CI/CD 自动部署 MXStoreBI6

on:
  push:
    branches:
      - main

env:
  PROJECT_NAME: MXStoreBI6
  DEPLOY_PATH: /var/www/MXStoreBI6
  VENV_PATH: /var/www/MXStoreBI6/venv

jobs:
  deploy:
    name: 部署到生产服务器（含备份）
    runs-on: ubuntu-latest

    steps:
      - name: 🧾 拉取仓库代码
        uses: actions/checkout@v4

      - name: 🚀 连接服务器并部署
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: deployuser
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script: |
            set -euo pipefail

            echo "✅ [连接成功] 主机: $(hostname) | 用户: $(whoami)"
            echo "📂 [步骤] 切换到部署目录: $DEPLOY_PATH"
            cd "$DEPLOY_PATH"

            echo "🔄 [步骤] 拉取远程最新代码"
            git config --global --add safe.directory "$DEPLOY_PATH"
            git fetch origin main
            git reset --hard origin/main

            echo "🐍 [步骤] 激活虚拟环境并安装依赖"
            source "$VENV_PATH/bin/activate"
            pip install --upgrade pip
            pip install -r requirements.txt

            echo "🛡️ [检测] 检查 sudo 免密权限 supervisorctl"
            if sudo -n /usr/bin/supervisorctl status >/dev/null 2>&1; then
              echo "✅ [权限验证] sudo 权限正常，继续部署"
            else
              echo "❌ [权限异常] sudo 权限不足，请检查 /etc/sudoers 配置"
              exit 1
            fi

            echo "🌀 [步骤] 重启 Supervisor 项目: $PROJECT_NAME"
            sudo -n /usr/bin/supervisorctl restart "$PROJECT_NAME"

            echo "🔍 [步骤] 执行部署后探测脚本"
            CHECK_SCRIPT="$DEPLOY_PATH/tools/post_deploy_check.sh"
            if [ -f "$CHECK_SCRIPT" ]; then
              echo "🔧 [探测脚本] 检测到 $CHECK_SCRIPT"
              chmod +x "$CHECK_SCRIPT"
              if bash "$CHECK_SCRIPT"; then
                echo "✅ [探测结果] 服务运行状态良好"
              else
                echo "❌ [探测失败] 服务状态异常，请检查日志"
                exit 1
              fi
            else
              echo "⚠️ [跳过探测] 未找到 $CHECK_SCRIPT，请确认是否遗漏"
            fi

            echo "📦 [备份] 当前部署目录"
            BACKUP_DIR="/var/backups/MXStoreBI6"
            BACKUP_FILE="$BACKUP_DIR/backup_$(date +%Y%m%d_%H%M%S).tar.gz"
            sudo mkdir -p "$BACKUP_DIR"
            sudo tar czf "$BACKUP_FILE" --exclude='venv' --exclude='__pycache__' .
            echo "✅ 备份完成: $BACKUP_FILE"

            echo "🧹 [清理] 保留最近 7 个备份"
            sudo ls -1t "$BACKUP_DIR"/backup_*.tar.gz | tail -n +8 | xargs -r sudo rm -f
            echo "✅ 多余备份已清理"

      - name: ✅ 输出部署完成
        run: echo "🎉 MXStoreBI6 部署流程执行完成。"
