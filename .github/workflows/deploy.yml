name: CI/CD 自动部署 MXStoreBI6

on:
  push:
    branches:
      - main

env:
  SSH_HOST: gothaieasy.fun

jobs:
  deploy:
    name: 部署到生产服务器
    runs-on: ubuntu-latest

    steps:
      - name: 🧾 拉取仓库代码
        uses: actions/checkout@v4

      - name: 🚀 连接服务器并部署
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ env.SSH_HOST }}
          username: deployuser
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script: |
            set -euo pipefail

            DEPLOY_PATH="/var/www/MXStoreBI6"
            VENV_PATH="$DEPLOY_PATH/venv"
            PROJECT_NAME="MXStoreBI6"

            DB_BACKUP_DIR="/var/backups/db/MXStoreBI6"
            DB_BACKUP_FILE="$DB_BACKUP_DIR/backup_$(date +%Y%m%d_%H%M%S).sql"
            DB_USER="${{ secrets.DB_USER }}"
            DB_PASSWORD="${{ secrets.DB_PASSWORD }}"
            DB_NAME="${{ secrets.DB_NAME }}"

            CODE_BACKUP_DIR="/var/backups/MXStoreBI6"
            CODE_BACKUP_FILE="$CODE_BACKUP_DIR/backup_$(date +%Y%m%d_%H%M%S).tar.gz"

            echo "✅ [连接成功] 主机: $(hostname) | 用户: $(whoami)"

            echo "💾 [备份] 数据库: $DB_NAME"
            sudo mkdir -p "$DB_BACKUP_DIR"
            sudo chown $(whoami):$(whoami) "$DB_BACKUP_DIR"
            mysqldump --no-tablespaces -u"$DB_USER" -p"$DB_PASSWORD" "$DB_NAME" > "$DB_BACKUP_FILE"
            echo "✅ 数据库备份完成: $DB_BACKUP_FILE"

            echo "⏸️ [预备] 暂停应用以进行安全备份"
            sudo -n /usr/bin/supervisorctl stop "$PROJECT_NAME" || {
              echo "⚠️ [警告] 无法停止应用，可能应用未运行，继续备份过程"
            }

            echo "📦 [备份] 代码目录: $DEPLOY_PATH"
            cd "$DEPLOY_PATH"
            sudo mkdir -p "$CODE_BACKUP_DIR"
            sudo chown $(whoami):$(whoami) "$CODE_BACKUP_DIR"
            # 添加 --warning=no-file-changed 忽略文件变化警告，避免因应用运行时文件变化导致备份失败
            if sudo tar czf "$CODE_BACKUP_FILE" --exclude='venv' --exclude='__pycache__' --exclude='*.log' --exclude='app.log*' --warning=no-file-changed .; then
              echo "✅ 代码备份完成: $CODE_BACKUP_FILE"
            else
              # 如果备份失败，检查是否是因为文件变化导致的非致命错误
              BACKUP_EXIT_CODE=$?
              if [ $BACKUP_EXIT_CODE -eq 1 ]; then
                echo "⚠️ [警告] 备份过程中部分文件发生变化，但备份文件已创建"
                if [ -f "$CODE_BACKUP_FILE" ] && [ -s "$CODE_BACKUP_FILE" ]; then
                  echo "✅ 代码备份完成: $CODE_BACKUP_FILE (有警告但文件完整)"
                else
                  echo "❌ [错误] 备份文件未正确创建"
                  exit 1
                fi
              else
                echo "❌ [错误] 备份失败，退出码: $BACKUP_EXIT_CODE"
                exit 1
              fi
            fi

            echo "🧹 [清理] 保留最近 7 个备份"
            sudo ls -1t "$DB_BACKUP_DIR"/backup_*.sql | tail -n +8 | xargs -r sudo rm -f || true
            sudo ls -1t "$CODE_BACKUP_DIR"/backup_*.tar.gz | tail -n +8 | xargs -r sudo rm -f || true

            echo "📂 [步骤] 更新最新代码"
            # 修复仓库权限与清理潜在锁文件，避免 .git/objects 权限问题
            if [ -d "$DEPLOY_PATH/.git" ]; then
              echo "🔧 [修复] 调整仓库权限与 Git 安全配置"
              sudo chown -R $(whoami):$(whoami) "$DEPLOY_PATH"
              find "$DEPLOY_PATH/.git/objects" -type d -exec chmod 775 {} \; 2>/dev/null || true
              find "$DEPLOY_PATH/.git/objects" -type f -exec chmod 664 {} \; 2>/dev/null || true
              rm -f "$DEPLOY_PATH/.git/index.lock" "$DEPLOY_PATH/.git/packed-refs.lock" "$DEPLOY_PATH/.git/shallow.lock" 2>/dev/null || true
              git config --global --add safe.directory "$DEPLOY_PATH" || true
            else
              echo "❌ [错误] 未检测到 Git 仓库 ($DEPLOY_PATH/.git)，请在服务器上初始化或克隆后重试"
              exit 1
            fi
            cd "$DEPLOY_PATH"
            git fetch origin main
            git reset --hard origin/main

            echo "🐍 [步骤] 激活虚拟环境并安装依赖"
            source "$VENV_PATH/bin/activate"
            pip install --upgrade pip
            pip install --no-cache-dir --upgrade -r requirements.txt

            echo "🗄️ [数据库迁移] 执行 flask db upgrade"
            flask db upgrade
            echo "✅ 数据库迁移完成"

            echo "🛡️ [检测] 检查 sudo 免密权限 supervisorctl"
            if sudo -n /usr/bin/supervisorctl status >/dev/null 2>&1; then
              echo "✅ [权限验证] sudo 权限正常"
            else
              echo "❌ [权限异常] sudo 权限不足，请检查 /etc/sudoers"
              exit 1
            fi

            echo "🌀 [步骤] 重启 Supervisor 项目: $PROJECT_NAME"
            sudo -n /usr/bin/supervisorctl restart "$PROJECT_NAME"

            echo "🔍 [步骤] 部署后健康检查"
            CHECK_SCRIPT="$DEPLOY_PATH/tools/post_deploy_check.sh"
            if [ -f "$CHECK_SCRIPT" ]; then
              echo "🔧 [探测脚本] 检测到 $CHECK_SCRIPT"
              chmod +x "$CHECK_SCRIPT"
              if bash "$CHECK_SCRIPT"; then
                echo "✅ [探测结果] 服务运行正常"
              else
                echo "❌ [探测失败] 服务异常，请检查日志"
                exit 1
              fi
            else
              echo "⚠️ [跳过探测] 未找到 $CHECK_SCRIPT"
            fi

            echo "📖 [提示] 可查看日志: sudo supervisorctl tail -100 $PROJECT_NAME"
            echo "🎉 [完成] 自动部署流程执行完毕"
