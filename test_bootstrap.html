<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Test</title>
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <h2 class="text-primary">Bootstrap 样式测试</h2>
        <div class="row">
            <div class="col-md-6">
                <form class="row g-3 mb-3 p-3 border rounded bg-light shadow-sm">
                    <div class="col-auto">
                        <select class="form-select">
                            <option value="all">全部类别</option>
                            <option value="mine">我的申请</option>
                            <option value="todo">待处理</option>
                        </select>
                    </div>
                    <div class="col-auto">
                        <select class="form-select">
                            <option value="all">全部时间</option>
                            <option value="24h">最近24小时</option>
                            <option value="7d">最近7天</option>
                        </select>
                    </div>
                    <div class="col-auto">
                        <button type="submit" class="btn btn-primary">查询</button>
                    </div>
                </form>
            </div>
            <div class="col-md-6">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">卡片标题</h5>
                        <p class="card-text">这是一个测试卡片，用来验证Bootstrap样式是否正常加载。</p>
                        <a href="#" class="btn btn-success">
                            <i class="bi bi-plus-circle"></i> 创建申请
                        </a>
                    </div>
                </div>
            </div>
        </div>
        <div class="table-responsive mt-4">
            <table class="table table-bordered table-hover">
                <thead class="table-primary text-center">
                    <tr>
                        <th>提交日期</th>
                        <th>店铺ID</th>
                        <th>提交人</th>
                        <th>审批人</th>
                        <th>金额</th>
                        <th>状态</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>2025-09-03</td>
                        <td>001</td>
                        <td>张三</td>
                        <td>李四</td>
                        <td>1000.00</td>
                        <td><span class="badge bg-warning">待审批</span></td>
                        <td>
                            <button class="btn btn-sm btn-outline-primary">查看</button>
                            <button class="btn btn-sm btn-success">审批</button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
